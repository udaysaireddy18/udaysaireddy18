<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" width="1600" height="420" role="img" aria-label="Uday Sai Reddy — Full-Stack Web Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="45%" stop-color="#a371f7"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a371f7" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#a371f7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <style>
      .name { font: 700 78px "Segoe UI", Inter, -apple-system, sans-serif; }
      .role { font: 500 30px "Segoe UI", Inter, -apple-system, sans-serif; fill: #c9d1d9; letter-spacing: 1px; }
      .tag  { font: 600 20px "Segoe UI", Inter, -apple-system, sans-serif; fill: #8b949e; letter-spacing: 2px; }
      .chip { font: 600 19px "Segoe UI", Inter, -apple-system, sans-serif; fill: #c9d1d9; }
      .dot  { animation: pulse 3.2s ease-in-out infinite; }
      .dot2 { animation: pulse 3.2s ease-in-out infinite 1.1s; }
      @keyframes pulse { 0%,100% { opacity: 0.35 } 50% { opacity: 0.9 } }
    </style>
  </defs>

  <rect width="1600" height="420" fill="url(#bg)"/>
  <rect width="1600" height="420" fill="url(#grid)"/>
  <ellipse class="dot" cx="230" cy="90" rx="320" ry="260" fill="url(#glow1)"/>
  <ellipse class="dot2" cx="1400" cy="340" rx="340" ry="260" fill="url(#glow2)"/>

  <rect x="86" y="96" width="6" height="132" rx="3" fill="url(#accent)"/>

  <text class="tag" x="118" y="122">HELLO, WORLD — I'M</text>
  <text class="name" x="116" y="200" fill="url(#accent)">Uday Sai Reddy</text>
  <text class="role" x="118" y="248">Full-Stack Web Developer</text>

  <g>
    <rect x="118" y="284" width="132" height="42" rx="21" fill="#161b22" stroke="#30363d"/>
    <text class="chip" x="184" y="311" text-anchor="middle">TypeScript</text>

    <rect x="262" y="284" width="106" height="42" rx="21" fill="#161b22" stroke="#30363d"/>
    <text class="chip" x="315" y="311" text-anchor="middle">React</text>

    <rect x="380" y="284" width="110" height="42" rx="21" fill="#161b22" stroke="#30363d"/>
    <text class="chip" x="435" y="311" text-anchor="middle">Node</text>

    <rect x="502" y="284" width="126" height="42" rx="21" fill="#161b22" stroke="#30363d"/>
    <text class="chip" x="565" y="311" text-anchor="middle">Python</text>

    <rect x="640" y="284" width="106" height="42" rx="21" fill="#161b22" stroke="#30363d"/>
    <text class="chip" x="693" y="311" text-anchor="middle">Vite</text>
  </g>

  <g opacity="0.85" filter="url(#soft)">
    <path d="M0 380 C 300 330, 600 420, 900 372 S 1350 320, 1600 372 L1600 420 L0 420 Z" fill="url(#accent)" opacity="0.14"/>
  </g>
</svg>
